name: CI

on:
  push:
    branches:
      - main
      - "migration/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Ensure Electron binary
        run: node scripts/ensure-electron.mjs
      - name: Electron E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Electron E2E
        if: runner.os != 'Linux'
        run: npm run test:e2e

  build:
    name: Build Electron app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Package Windows app
        run: node scripts/build-windows.mjs

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: diffly-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  package-mac:
    name: Package macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Ad hoc signing uses no secrets, so it is safe to run for pull requests.
          CSC_FOR_PULL_REQUEST: true
        run: npx electron-builder --mac dir --publish never --config.npmRebuild=false

      - name: Verify macOS code signature
        run: |
          for app in release/mac*/Diffly.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app"
          done
